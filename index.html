<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ユーマスター</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
/* 夜空の冒険ゲーム：濃紺の宇宙に、金と桃色のおもちゃっぽいUI（意図的にダークのみ） */
:root{
  --bg:#0a0f2e; --ink:#fffdf5; --gold:#ffcf3a; --pink:#ff6fae; --mint:#5df0b0; --panel:rgba(16,22,64,.88); --stroke:#1b1f4a;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Mochiy Pop One','Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif; }
#app{ position:fixed; inset:0; }
canvas#c{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.hidden{ display:none !important; }
.layer{ position:absolute; inset:0; pointer-events:none; }
.layer > *{ pointer-events:auto; }
button{ font-family:inherit; cursor:pointer; }

.btn{ border:0; border-radius:999px; background:var(--gold); color:#3a2300; font-size:22px; padding:14px 26px;
  box-shadow:0 6px 0 #c58f00; transition:transform .08s, box-shadow .08s; }
.btn:active{ transform:translateY(5px); box-shadow:0 1px 0 #c58f00; }
.btn.big{ font-size:34px; padding:20px 54px; }
.btn.pink{ background:var(--pink); color:#fff; box-shadow:0 6px 0 #b8316f; }
.btn.pink:active{ box-shadow:0 1px 0 #b8316f; }
.btn.ghost{ background:rgba(16,22,64,.72); color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.4); font-size:19px; padding:10px 18px; border:2px solid rgba(255,255,255,.35); }

/* title */
#title{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center;
  background:radial-gradient(ellipse at center, rgba(10,15,46,.1) 0%, rgba(10,15,46,.78) 75%); pointer-events:auto; }
.logo{ font-size:clamp(54px,15vw,120px); line-height:1.02; letter-spacing:.04em; color:var(--gold);
  text-shadow:0 5px 0 #b8316f, 0 10px 0 rgba(0,0,0,.35), 0 0 40px rgba(255,207,58,.5); transform:rotate(-3deg); }
.logo span{ display:block; color:var(--ink); font-size:.55em; text-shadow:0 4px 0 #1b2a8a, 0 8px 0 rgba(0,0,0,.35); letter-spacing:.12em; }
.sub{ font-size:clamp(17px,4.4vw,26px); color:var(--ink); text-shadow:0 2px 6px rgba(0,0,0,.7); }

/* HUD */
.top{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.chip{ background:var(--panel); border:2px solid rgba(255,255,255,.25); border-radius:18px; padding:8px 16px; font-size:19px; text-align:center; }
#msg{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 120px); background:var(--panel);
  border-radius:22px; padding:12px 22px; font-size:clamp(17px,4.2vw,24px); text-align:center; max-width:92vw; border:2px solid rgba(255,255,255,.25); pointer-events:none; }
#pad{ position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; justify-content:space-between; padding:0 16px; pointer-events:none; }
#pad .grp{ display:flex; gap:12px; pointer-events:auto; }
.arrow{ width:72px; height:72px; border-radius:50%; border:3px solid rgba(255,255,255,.45); background:rgba(16,22,64,.72); color:var(--ink);
  font-size:30px; touch-action:none; user-select:none; -webkit-user-select:none; display:flex; align-items:center; justify-content:center; }
.arrow:active, .arrow.on{ background:var(--gold); color:#3a2300; }
#edge{ position:absolute; top:50%; font-size:64px; color:var(--gold); text-shadow:0 0 18px rgba(255,207,58,.9); pointer-events:none; animation:blink .8s infinite alternate; }
#edge.l{ left:10px; } #edge.r{ right:10px; }
@keyframes blink{ from{ opacity:.35; transform:scale(.9);} to{ opacity:1; transform:scale(1.15);} }
#where{ font-size:21px; }

/* UMA pop-out */
#pop{ position:fixed; left:0; top:0; z-index:5; pointer-events:none; will-change:transform; }
.uma-art{ width:min(46vw,230px); height:min(46vw,230px); display:flex; align-items:center; justify-content:center; }
.uma-art .emo{ font-size:min(36vw,170px); line-height:1; filter:drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
.uma-art img{ max-width:100%; max-height:100%; border-radius:20px; object-fit:contain; filter:drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
#pop.wob .uma-art{ animation:wob .9s ease-in-out infinite; }
#pop.hit .uma-art{ animation:hit .22s ease-out; }
#pop.gone .uma-art{ transition:transform .9s cubic-bezier(.6,-0.3,.8,.6), opacity .9s; transform:scale(0) rotate(720deg); opacity:0; }
@keyframes wob{ 0%,100%{ transform:rotate(-6deg) translateY(0);} 50%{ transform:rotate(6deg) translateY(-12px);} }
@keyframes hit{ 0%{ transform:scale(1);} 40%{ transform:scale(1.28) rotate(8deg);} 100%{ transform:scale(1);} }
#catchUI{ position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 70px); text-align:center; pointer-events:none; }
#stars{ font-size:56px; letter-spacing:.2em; color:var(--gold); text-shadow:0 0 16px rgba(255,207,58,.8); }
#prompt{ font-size:clamp(20px,5vw,30px); margin-bottom:4px; text-shadow:0 2px 8px rgba(0,0,0,.8); }
#flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:8; transition:opacity .5s; }
#flash.on{ opacity:.9; transition:none; }
#fade{ position:fixed; inset:0; background:#0a0f2e; opacity:0; pointer-events:none; z-index:9; transition:opacity .45s; }
#fade.on{ opacity:1; pointer-events:auto; }

/* modal */
.modal{ position:fixed; inset:0; z-index:7; background:rgba(5,8,28,.9); display:flex; flex-direction:column; align-items:center; padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px); overflow:auto; }
.modal h2{ margin:6px 0 4px; font-size:30px; color:var(--gold); font-weight:400; }
.prog{ width:min(520px,92vw); height:22px; background:rgba(255,255,255,.15); border-radius:99px; overflow:hidden; margin:6px 0 4px; }
.prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--mint),var(--gold)); transition:width .6s; }
#pct{ font-size:20px; margin-bottom:12px; }
#zgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; width:min(900px,96vw); }
.zc{ background:var(--panel); border:3px solid var(--mint); border-radius:20px; padding:10px; text-align:center; }
.zc .uma-art{ width:100%; height:120px; }
.zc .uma-art .emo{ font-size:84px; }
.zc.sil{ border-color:rgba(255,255,255,.2); }
.zc.sil .uma-art{ filter:brightness(0) invert(1) opacity(.22); }
.zn{ font-size:21px; margin-top:4px; }
.zd{ font-size:13px; line-height:1.5; margin-top:4px; opacity:.9; font-family:'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif; }
.zfoot{ margin-top:18px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

#card{ position:fixed; inset:0; z-index:7; background:rgba(5,8,28,.82); display:flex; align-items:center; justify-content:center; padding:16px; }
.cardbox{ background:var(--panel); border:4px solid var(--gold); border-radius:28px; padding:20px; width:min(440px,94vw); text-align:center; }
.cardbox h3{ margin:0 0 4px; font-size:26px; color:var(--gold); font-weight:400; }
.cardbox .nm{ font-size:36px; margin:2px 0 6px; }
.cardbox .ds{ font-size:15px; line-height:1.7; margin-bottom:14px; font-family:'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif; }
.cardbox .uma-art{ margin:0 auto; }
.conf{ position:fixed; top:-60px; font-size:34px; z-index:10; pointer-events:none; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(115vh) rotate(540deg); } }
/* 地域名ラベル */
#labels{ position:absolute; inset:0; pointer-events:none; }
.lbl{ position:absolute; left:0; top:0; pointer-events:auto; white-space:nowrap; cursor:pointer; border:0; background:none; padding:6px 10px;
  font-family:inherit; font-size:clamp(18px,4.6vw,24px); color:#fff; will-change:transform;
  -webkit-text-stroke:6px var(--stroke); paint-order:stroke fill; text-shadow:0 3px 0 rgba(0,0,0,.35); }
.lbl.done{ color:var(--mint); }
.lbl:focus-visible{ outline:3px solid var(--gold); border-radius:12px; }
/* カメラ */
#cam{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
#arBtn.on{ background:var(--mint); color:#063a26; border-color:#fff; }
#arHint{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 104px); background:var(--panel); border-radius:18px; padding:8px 16px; font-size:16px; text-align:center; max-width:92vw; border:2px solid rgba(255,255,255,.25); pointer-events:none; }
.logo-img{ max-width:min(86vw,560px); max-height:40vh; }
#msg, #msg2, #arHint{ width:max-content; max-width:min(92vw,560px) !important; }
.top .btn, .chip{ white-space:nowrap; }
@media (max-width:440px){ .top .btn.ghost, .chip{ font-size:16px; padding:8px 12px; } #where{ font-size:16px; } }
.btn:focus-visible, .arrow:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
@media (prefers-reduced-motion: reduce){ #pop.wob .uma-art, #edge{ animation:none; } }
</style>
</head>
<body>
<div id="app">
  <video id="cam" class="hidden" playsinline muted autoplay></video>
  <canvas id="c"></canvas>

  <div id="title" class="layer">
    <div class="sub">UMAを あつめよう！</div>
    <div class="logo" id="logo">ユーマ<span>スター！</span></div>
    <button class="btn big" id="startBtn">▶ スタート</button>
  </div>

  <div id="hudGlobe" class="layer hidden">
    <div id="labels"></div>
    <div class="top">
      <button class="btn ghost" id="zukanBtn">📖 ずかん <span id="cnt">0/5</span></button>
      <button class="btn ghost" id="arBtn">📷 カメラ</button>
      <button class="btn ghost" id="sndBtn1">🔊</button>
    </div>
    <div id="msg">ひかっている ところを タッチしてね</div>
  </div>

  <div id="hudField" class="layer hidden">
    <div class="top">
      <button class="btn ghost" id="backBtn">🌍 もどる</button>
      <div class="chip" id="where"></div>
      <button class="btn ghost" id="sndBtn2">🔊</button>
    </div>
    <div id="fmsg"><div id="msg2" class="" style="position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 74px);background:var(--panel);border-radius:22px;padding:10px 20px;font-size:clamp(16px,4vw,22px);text-align:center;max-width:92vw;border:2px solid rgba(255,255,255,.25);pointer-events:none;">👀 ガサガサ している ところを さがしてね</div></div>
    <div id="arHint" class="hidden"></div>
    <div id="edge" class="hidden">◀</div>
    <div id="catchUI" class="hidden"><div id="prompt"></div><div id="stars">☆☆☆</div></div>
  </div>

  <div id="pad" class="hidden">
    <div class="grp"><button class="arrow" data-k="left" aria-label="ひだりを みる">◀</button><button class="arrow" data-k="right" aria-label="みぎを みる">▶</button></div>
    <div class="grp"><button class="arrow" data-k="up" aria-label="うえを みる">▲</button><button class="arrow" data-k="down" aria-label="したを みる">▼</button></div>
  </div>

  <div id="pop" class="hidden"></div>
  <div id="flash"></div>
  <div id="fade"></div>

  <div id="zukan" class="modal hidden">
    <h2>📖 UMAずかん</h2>
    <div class="prog"><i id="bar"></i></div>
    <div id="pct"></div>
    <div id="znote" class="hidden" style="font-size:14px;opacity:.9;margin-bottom:10px;text-align:center;font-family:'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif">UMAごとに がぞうを えらべます（この たんまつの ブラウザに ほぞん）</div>
    <div id="zgrid"></div>
    <input type="file" id="zfile" accept="image/*" style="position:fixed;left:-9999px;opacity:0">
    <div class="zfoot">
      <button class="btn pink" id="zclose">✕ とじる</button>
      <button class="btn ghost" id="zedit">🔧 おとなモード</button>
      <button class="btn ghost" id="zreset">さいしょから</button>
    </div>
  </div>

  <div id="card" class="hidden"><div class="cardbox" id="cardbox"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* 音 */
let ac=null;
function A(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(f,d=.15,type='sine',v=.15,delay=0){
  if(!sound) return; const c=A(); if(!c) return; const t=c.currentTime+delay;
  const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.02);
}
function rustle(pan,vol){
  if(!sound) return; const c=A(); if(!c) return;
  const n=Math.floor(c.sampleRate*.35), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++){ const e=Math.sin(Math.PI*i/n); d[i]=(Math.random()*2-1)*e*(Math.random()<.5?1:.3); }
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=.7;
  const g=c.createGain(); g.gain.value=vol; s.connect(f); f.connect(g);
  if(c.createStereoPanner){ const p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1); g.connect(p); p.connect(c.destination); } else g.connect(c.destination);
  s.start();
}
/* ---- BGM（プログラムで作る、ちいさな ぼうけんの きょく） ----
   C - Am - F - G の 8小節を くりかえす。8分音符 = 1ステップ。 */
const BGM={ bpm:104, vol:.11, gain:null, timer:null, step:0, next:0, noise:null, want:false };
const MEL=[ // _ はのばす、0 はやすみ
  72,'_',76,'_',79,'_',76,74,   72,'_',69,'_',72,'_','_',0,
  69,'_',72,'_',77,'_',76,74,   74,'_','_',71,74,'_','_',0,
  76,'_',79,'_',84,'_',81,79,   76,'_',72,'_',76,'_',74,72,
  74,'_',72,'_',69,'_',72,74,   71,'_',74,'_',79,'_',77,74 ];
const CHORDS=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]], ROOTS=[48,45,41,43];
const hz=m=>440*Math.pow(2,(m-69)/12);
function bgmNote(f,t,d,type,v){
  const c=ac, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g); g.connect(BGM.gain); o.start(t); o.stop(t+d+.05);
}
function bgmShaker(t,v){
  const c=ac; if(!BGM.noise){ const n=Math.floor(c.sampleRate*.06), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); BGM.noise=b; }
  const s=c.createBufferSource(); s.buffer=BGM.noise; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
  const g=c.createGain(); g.gain.value=v; s.connect(f); f.connect(g); g.connect(BGM.gain); s.start(t);
}
function bgmSchedule(){
  const sp=60/BGM.bpm/2;
  while(BGM.next<ac.currentTime+.35){
    const i=BGM.step%64, bar=Math.floor(i/8), pos=i%8, t=BGM.next, ch=bar%4;
    const m=MEL[i];
    if(typeof m==='number'&&m>0){ let len=1; while(MEL[(i+len)%64]==='_') len++; bgmNote(hz(m),t,sp*len*.95,'triangle',.5); }
    if(pos===0){ CHORDS[ch].forEach(n=>bgmNote(hz(n),t,sp*8,'sine',.09)); }
    if(pos===0||pos===4) bgmNote(hz(ROOTS[ch]),t,sp*3,'sine',.42);
    bgmShaker(t,pos%2?.05:.12);
    BGM.step++; BGM.next+=sp;
  }
}
function bgmFade(on){
  BGM.want=on; const c=A(); if(!c) return;
  if(!BGM.gain){ BGM.gain=c.createGain(); BGM.gain.gain.value=0; BGM.gain.connect(c.destination); }
  const target=(on&&sound)?BGM.vol:0, now=c.currentTime;
  BGM.gain.gain.cancelScheduledValues(now); BGM.gain.gain.setValueAtTime(BGM.gain.gain.value,now); BGM.gain.gain.linearRampToValueAtTime(target,now+.8);
  if(target>0&&!BGM.timer){ BGM.next=c.currentTime+.05; BGM.timer=setInterval(bgmSchedule,90); bgmSchedule(); }
  if(target===0&&BGM.timer){ const tm=BGM.timer; BGM.timer=null; setTimeout(()=>clearInterval(tm),900); }
}
function say(t){
  if(!sound||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.85; u.pitch=1.3; speechSynthesis.speak(u); }catch(e){}
}

  if(!sound&&'speechSynthesis' in window) speechSynthesis.cancel();
  bgmFade(BGM.want);
}

function makeEarth(){
  const W=2048,H=1024,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#5cc3ff'); grad.addColorStop(.5,'#3fa4f5'); grad.addColorStop(1,'#5cc3ff');
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  // 波もよう
  g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=4; g.lineCap='round';
  for(let i=0;i<260;i++){ const x=Math.random()*W,y=Math.random()*H*.9+H*.05; g.beginPath(); g.arc(x,y,10+Math.random()*8,Math.PI*1.1,Math.PI*1.9); g.stroke(); }
  const P=p=>[(p[0]+180)/360*W,(90-p[1])/180*H];
  const path=poly=>{ g.beginPath(); poly.forEach((p,i)=>{ const [x,y]=P(p); i?g.lineTo(x,y):g.moveTo(x,y); }); g.closePath(); };
  g.lineJoin='round';
  LAND.forEach(([col,poly])=>{ path(poly); g.lineWidth=26; g.strokeStyle='rgba(200,245,255,.6)'; g.stroke(); });   // あさせ
  LAND.forEach(([col,poly])=>{ path(poly); g.fillStyle=col; g.fill(); g.lineWidth=5; g.strokeStyle='#2f6f5a'; g.stroke(); });
  g.fillStyle='#f2f8ff'; g.fillRect(0,H*.93,W,H*.07); g.fillStyle='#2f6f5a'; g.fillRect(0,H*.93,W,4);
  // ふわふわ雲
  g.fillStyle='rgba(255,255,255,.8)';
  for(let i=0;i<22;i++){ const x=Math.random()*W,y=Math.random()*H*.8+H*.1; for(let k=0;k<4;k++){ g.beginPath(); g.ellipse(x+k*26-40,y+(k%2)*-8,34,18,0,0,Math.PI*2); g.fill(); } }
  return new THREE.CanvasTexture(c);
}

function makeTree(kind,x,z,s,leaf){
  const g=new THREE.Group(), ol=darker(leaf||0x3a8a3a,.35);
  const trunk=(h,r)=>{ const t=outlined(new THREE.Mesh(new THREE.CylinderGeometry(r*.7,r,h,8),toon(0x9a6a40)),.12,0x3a2414); t.position.y=h/2; g.add(t); return t; };
  if(kind==='pine'){
    trunk(1.2,.22);
    [[1.25,1.7,1.5],[.95,2.6,1.4],[.65,3.5,1.3]].forEach(([r,y,h],i)=>{
      const c=outlined(new THREE.Mesh(new THREE.ConeGeometry(r,h,9),toon(new THREE.Color(leaf).offsetHSL(0,0,i*.04))),.07,ol); c.position.y=y; g.add(c); });
  } else if(kind==='palm'){
    const t=trunk(3.6,.2); t.rotation.z=.12;
    for(let i=0;i<5;i++){ const p=new THREE.Group(); p.position.y=3.6; p.rotation.y=i*Math.PI*2/5;
      const l=outlined(new THREE.Mesh(new THREE.SphereGeometry(1,10,6),toon(leaf)),.08,ol); l.scale.set(1.5,.16,.5); l.position.set(.95,-.1,0); l.rotation.z=-.3; p.add(l); g.add(p); }
  } else {
    trunk(1.5,.25);
    [[0,2.6,0,1.25],[.85,2.1,.3,.9],[-.85,2.2,-.25,.95],[.1,3.3,.1,.8]].forEach(([cx,cy,cz,r],i)=>{
      const c=outlined(new THREE.Mesh(new THREE.SphereGeometry(r,14,10),toon(new THREE.Color(leaf).offsetHSL(0,0,i===3?.07:0))),.06,ol); c.position.set(cx,cy,cz); g.add(c); });
  }
  g.position.set(x,0,z); g.scale.setScalar(s); return g;
}
function makeBush(color){

  [[0,.6,0,.8],[.6,.42,.15,.58],[-.55,.45,-.1,.6],[.1,.98,.1,.5],[-.1,.45,.5,.5]].forEach(([x,y,z,r],i)=>{
    const m=outlined(new THREE.Mesh(new THREE.SphereGeometry(r,14,10),toon(base.clone().offsetHSL(0,.02,i===3?.1:(i%2?.04:-.02)))),.07,ol); m.position.set(x,y,z); g.add(m); });
  [0xff7aa8,0xffe066,0xffffff,0xff9a5a].forEach(c=>{ const a=Math.random()*Math.PI*2, b=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),new THREE.MeshBasicMaterial({color:c}));
    b.position.set(Math.cos(a)*.72,.55+Math.random()*.45,Math.sin(a)*.72); g.add(b); });

}

    for(let i=0;i<n;i++){ const a=Math.random()*6.283,d=rmin+Math.random()*(rmax-rmin);

      if(colors) im.setColorAt(i,new THREE.Color(colors[i%colors.length])); }

  scatter(new THREE.InstancedMesh(new THREE.ConeGeometry(.12,.6,4),toon(gcol.clone().offsetHSL(0,.05,-.12)),320),320,2,34,.3,.6,1.4);
  scatter(new THREE.InstancedMesh(new THREE.SphereGeometry(.13,8,6),toon(0xffffff),160),160,2.5,30,.13,.8,1.4,e.flowers);
  // 遠くの山
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2+Math.random()*.2, d=64+Math.random()*10, h=(r.id==='nepal'?34:14)+Math.random()*12;
    const m=outlined(new THREE.Mesh(new THREE.ConeGeometry(h*.55,h,7),toon(e.mtn)),.03,darker(e.mtn,.55)); m.position.set(Math.sin(a)*d,h/2,-Math.cos(a)*d);

  // 木

    const n=r.id==='usa'?46:28;
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, d=14+Math.random()*26, col=(e.alt&&Math.random()<e.altP)?e.alt:e.leaf;

  for(let i=0;i<8;i++){
    const piv=new THREE.Group(); piv.rotation.y=Math.random()*6.28; piv.userData.sp=(.008+Math.random()*.014)*(Math.random()<.5?1:-1);
    const c=new THREE.Group();

      const sp=outlined(new THREE.Mesh(new THREE.SphereGeometry(rr,12,8),new THREE.MeshBasicMaterial({color:0xffffff})),.05,0xbcd4ea); sp.position.set(x,y,z); c.add(sp); });
    c.position.set(0,26+Math.random()*10,-(55+Math.random()*10)); c.scale.setScalar(.9+Math.random()*.8); piv.add(c); fieldScene.add(piv); clouds.push(piv);
  }

}

/* ============ ARモード（カメラで さがす） ============
   カメラ映像の上に3Dを重ね、スマホの向き（傾きセンサー）でまわりを見渡す。
   センサーが無い時はドラッグ・十字キーで見渡す。カメラが使えない時は3Dの景色に切りかえる。 */
let arOn=false; try{ arOn=localStorage.getItem('umaquest.ar')==='1'; }catch(e){}
const arCam=new THREE.PerspectiveCamera(62,1,.05,100);
arCam.rotation.order='YXZ';
let arScene=null, arStream=null, arBushes=[], arTargetAng=0, arUma=null, arShadow=null, arSparks=[], arPlaced=false, arT=0, arYaw=0, arPitch=0;
let orient=null;
const _z=new THREE.Vector3(0,0,1), _eu=new THREE.Euler(), _q0=new THREE.Quaternion(), _q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
const D2R=Math.PI/180, wrapAng=a=>((a%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI;
function onOrient(e){ if(e.alpha==null||e.beta==null) return; orient={a:e.alpha,b:e.beta,g:e.gamma||0}; }
function applyOrient(cam){
  const so=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*D2R;
  _eu.set(orient.b*D2R,orient.a*D2R,-orient.g*D2R,'YXZ');
  cam.quaternion.setFromEuler(_eu); cam.quaternion.multiply(_q1); cam.quaternion.multiply(_q0.setFromAxisAngle(_z,-so));
}
function camYaw(cam){ const v=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion); return Math.atan2(-v.x,-v.z); }

function setAR(v){
  arOn=v; try{ localStorage.setItem('umaquest.ar',v?'1':'0'); }catch(e){}
  const b=$('arBtn'); b.classList.toggle('on',v); b.textContent=v?'📷 カメラ オン':'📷 カメラ'; b.setAttribute('aria-pressed',String(v));
}
async function startCamera(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    arStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('cam'); v.srcObject=arStream; v.classList.remove('hidden'); await v.play().catch(()=>{});
    return true;
  }catch(e){ stopAR(); return false; }
}
function stopAR(){
  if(arStream){ arStream.getTracks().forEach(t=>t.stop()); arStream=null; }
  const v=$('cam'); v.classList.add('hidden'); try{ v.srcObject=null; }catch(e){}
  removeEventListener('deviceorientation',onOrient);
  arScene=null; arUma=null; arBushes=[]; arSparks=[];
}
function buildAR(r){
  curRegion=r; arScene=new THREE.Scene(); arBushes=[]; arSparks=[]; arUma=null; arShadow=null;
  arScene.add(new THREE.AmbientLight(0xffffff,.85));
  const dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(2,5,3); arScene.add(dl);
  orient=null; arPlaced=false; arT=0; arYaw=0; arPitch=-.25;
  addEventListener('deviceorientation',onOrient);
  stateF='search'; searchT=0; taps=0;
}
/* 見ている向きを「まえ」にして、まわりに草むらを置く */
function placeAR(yaw0){
  const e=curRegion.env, N=6, d=2.6, y=-1.0;
  const offs=[]; for(let i=0;i<N;i++) offs.push(i/N*Math.PI*2+(Math.random()-.5)*.3);
  const far=offs.map((o,i)=>i).filter(i=>{ const dd=Math.abs(wrapAng(offs[i])); return dd>1.6; });
  const ti=far[Math.floor(Math.random()*far.length)];
  offs.forEach((o,i)=>{
    const a=yaw0+o, b=makeBush(e.bush); b.scale.setScalar(.55);
    b.position.set(-Math.sin(a)*d,y,-Math.cos(a)*d); b.userData={idx:i,ang:a,base:b.position.clone(),wig:-9,target:i===ti};
    arScene.add(b); arBushes.push(b);
    if(i===ti){ arTargetAng=a;
      for(let k=0;k<5;k++){ const s=new THREE.Mesh(new THREE.OctahedronGeometry(.05),new THREE.MeshBasicMaterial({color:0xffe066})); s.userData={k,base:b.position}; arScene.add(s); arSparks.push(s); } }
  });
  // ゆか の かげ（草むらの下）
  arBushes.forEach(b=>{ const sh=new THREE.Mesh(new THREE.CircleGeometry(.5,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22,depthWrite:false}));
    sh.rotation.x=-Math.PI/2; sh.position.set(b.position.x,b.position.y+.01,b.position.z); arScene.add(sh); });
  arPlaced=true;
}

    g.font='190px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(u.emoji,128,140);
    cb(new THREE.CanvasTexture(c),1); };
  const src=imgOf(u); if(!src) return emo();
  const im=new Image(); im.onload=()=>{ const t=new THREE.Texture(im); t.needsUpdate=true; cb(t,im.width/im.height||1); }; im.onerror=emo; im.src=src;
}
function arReveal(){
  stateF='reveal'; const u=umaOf(curRegion), b=arBushes.find(x=>x.userData.target);
  $('edge').classList.add('hidden'); $('msg2').classList.add('hidden'); $('arHint').classList.add('hidden');
  arSparks.forEach(s=>arScene.remove(s)); arSparks=[];
  tone(520,.1,'square',.1); tone(780,.12,'square',.1,.08); tone(1040,.2,'square',.1,.16);
  say('わっ！ でてきた！');
  umaTexture(u,(tex,asp)=>{
    if(!arScene) return;
    const h=1.0, w=Math.min(2.2,h*asp);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/asp),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
    const a=arTargetAng, to=new THREE.Vector3(-Math.sin(a)*1.9,-.25,-Math.cos(a)*1.9);
    m.userData={t0:performance.now()/1000,from:b.position.clone(),to,hit:-9,gone:-9};
    arScene.add(m); arUma=m;
    arShadow=new THREE.Mesh(new THREE.CircleGeometry(.45,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false}));
    arShadow.rotation.x=-Math.PI/2; arScene.add(arShadow);
  });
}
function updateAR(dt,t){
  if(orient) applyOrient(arCam);
  else { arYaw+=((keys.left?1:0)-(keys.right?1:0))*1.7*dt; arPitch=clamp(arPitch+((keys.up?1:0)-(keys.down?1:0))*1.0*dt,-.9,.6); arCam.rotation.set(arPitch,arYaw,0,'YXZ'); }
  arT+=dt;
  if(!arPlaced&&(orient||arT>1.2)) placeAR(camYaw(arCam));
  $('pad').classList.toggle('hidden',!!orient);
  if(stateF==='search'&&arPlaced){
    searchT+=dt;
    const d=wrapAng(arTargetAng-camYaw(arCam));
    rustleT-=dt; if(rustleT<=0){ rustleT=1.5; rustle(-Math.sin(d),.06+.16*(Math.cos(d)+1)/2); }
    const e=$('edge');
    if(searchT>HINT_SECONDS&&Math.abs(d)>.6){ e.classList.remove('hidden'); e.textContent=d>0?'◀':'▶'; e.className=d>0?'l':'r'; } else e.classList.add('hidden');
  }
  arBushes.forEach(b=>{
    const u=b.userData; let ox=0,rz=0;
    if(u.target&&stateF==='search'){ ox=Math.sin(t*38)*.04; rz=Math.sin(t*31)*.08; }
    const w=t-u.wig; if(w<.6){ ox+=Math.sin(w*40)*.03*(1-w/.6); rz+=Math.sin(w*36)*.06*(1-w/.6); }
    b.position.x=u.base.x+ox; b.rotation.z=rz;
  });
  arSparks.forEach(s=>{ const k=s.userData.k, a=t*2+k*1.26; s.position.set(s.userData.base.x+Math.cos(a)*.45, s.userData.base.y+.45+Math.sin(t*3+k)*.18, s.userData.base.z+Math.sin(a)*.45); s.rotation.y=t*4; });
  if(arUma){
    const ud=arUma.userData, k=Math.min(1,(t-ud.t0)/1.1);
    arUma.position.lerpVectors(ud.from,ud.to,k); arUma.position.y+=Math.sin(k*Math.PI)*.9;
    let s=.2+.8*k;
    if(stateF==='catch'){ arUma.position.y+=Math.sin(t*4)*.06; }
    const hw=t-ud.hit; if(hw<.25) s*=1+.28*Math.sin(hw/.25*Math.PI);
    arUma.quaternion.copy(arCam.quaternion);
    let rz=stateF==='catch'?Math.sin(t*6)*.1:0;
    const gw=t-ud.gone; if(gw>=0&&gw<2){ const g=Math.min(1,gw/.9); s*=1-g; rz+=g*Math.PI*4; }
    arUma.rotateZ(rz); arUma.scale.setScalar(Math.max(.001,s));
    if(arShadow){ arShadow.position.set(arUma.position.x,-1.0,arUma.position.z); arShadow.scale.setScalar(Math.max(.001,s)); }
    if(k>=1&&stateF==='reveal') startCatch();
  }
  renderer.render(arScene,arCam);
}

/* ============ 画面遷移 ============ */
function showOnly(name){
  ['title','hudGlobe','hudField'].forEach(id=>$(id).classList.toggle('hidden',id!==name));
  $('pad').classList.toggle('hidden',name==='title');
}
function fadeTo(fn){ $('fade').classList.add('on'); setTimeout(()=>{ fn(); $('fade').classList.remove('on'); },480); }
function updateCnt(){ $('cnt').textContent=`${caught.length}/${UMA_LIST.length}`; }

function goGlobe(){

function enterRegion(r){
  if(mode!=='globe') return;

      if(mode!=='loading'){ stopAR(); return; }

    }); });

  fadeTo(()=>{ buildField(r); mode='field'; fieldHud(r); $('msg2').textContent='👀 ガサガサ している ところを さがしてね'; });

/* ガサガサ→とびだす→つかまえる */
function reveal(){
  stateF='reveal'; const u=umaOf(curRegion);
  $('edge').classList.add('hidden'); $('msg2').classList.add('hidden');
  const b=bushes[target], v=new THREE.Vector3(); b.getWorldPosition(v); v.y+=.8; v.project(fieldCam);
  const sx=(v.x+1)/2*innerWidth, sy=(1-v.y)/2*innerHeight;
  const pop=$('pop'); pop.className=''; pop.innerHTML=''; pop.appendChild(umaEl(u));
  const tx=innerWidth/2, ty=innerHeight*.42, t0=performance.now(), D=1100;
  tone(520,.1,'square',.1); tone(780,.12,'square',.1,.08); tone(1040,.2,'square',.1,.16);
  say('わっ！ でてきた！');
  (function step(now){
    const k=Math.min(1,(now-t0)/D);
    const x=sx+(tx-sx)*k, y=sy+(ty-sy)*k-Math.sin(k*Math.PI)*innerHeight*.28, s=.25+.75*k;
    pop.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${s})`;
    if(k<1) requestAnimationFrame(step); else startCatch();
  })(t0);
}
function startCatch(){
  stateF='catch'; taps=0; if(mode!=='ar') $('pop').classList.add('wob');
  $('stars').textContent='☆☆☆'; $('prompt').textContent='さわって つかまえよう！'; $('catchUI').classList.remove('hidden');
  say('さわって、つかまえよう！');
}
function catchTap(){
  if(taps>=3) return;
  taps++;
  if(mode==='ar'){ if(arUma) arUma.userData.hit=performance.now()/1000; }
  else { const pop=$('pop'); pop.classList.remove('wob','hit'); void pop.offsetWidth; pop.classList.add('hit');
    setTimeout(()=>{ if(stateF==='catch') pop.classList.add('wob'); },240); }
  tone(420+taps*180,.18,'triangle',.18);
  $('stars').textContent='★'.repeat(taps)+'☆'.repeat(3-taps);
  if(taps>=3) capture();
}
function capture(){
  stateF='done'; const u=umaOf(curRegion);
  if(mode==='ar'){ if(arUma) arUma.userData.gone=performance.now()/1000; }
  else { $('pop').classList.remove('wob','hit'); $('pop').classList.add('gone'); }
  $('prompt').textContent='つかまえた！'; 
  const f=$('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),60);
  [523,659,784,1047,1319].forEach((n,i)=>tone(n,.28,'triangle',.18,i*.11));
  if(!caught.includes(u.id)){ caught.push(u.id); store.set(caught); }
  setTimeout(()=>showCard(u),1000);
}
function showCard(u){
  const done=caught.length>=UMA_LIST.length, box=$('cardbox'); box.innerHTML='';
  const h=document.createElement('h3'); h.textContent=done?'🎉 ずかん コンプリート！':'✨ ずかんに とうろくしたよ！'; box.appendChild(h);

function confetti(){
  const set=['🎉','⭐','✨','🎊','💛'];
  for(let i=0;i<40;i++){ const s=document.createElement('span'); s.className='conf'; s.textContent=set[i%set.length];
    s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(2+Math.random()*2.5)+'s'; s.style.animationDelay=Math.random()*1.2+'s';

}

/* ============ ずかん ============ */
let resetArm=false, editMode=false, editTarget=null;

    const has=caught.includes(u.id), show=has||editMode, r=regionOf(u);
    const d=document.createElement('div'); d.className='zc'+(show?'':' sil'); d.appendChild(umaEl(u));

function openZukan(){ editMode=false; $('zedit').textContent='🔧 おとなモード'; renderZukan(); $('zukan').classList.remove('hidden'); }
$('zedit').onclick=()=>{ editMode=!editMode; $('zedit').textContent=editMode?'🔧 おとなモード：オン':'🔧 おとなモード'; renderZukan(); };
$('zfile').onchange=e=>{

/* ============ 入力 ============ */
let drag=null;
cv.addEventListener('pointerdown',e=>{ drag={lx:e.clientX,ly:e.clientY,moved:0}; try{cv.setPointerCapture(e.pointerId);}catch(_){} A(); });
cv.addEventListener('pointermove',e=>{
  if(!drag) return; const dx=e.clientX-drag.lx, dy=e.clientY-drag.ly; drag.lx=e.clientX; drag.ly=e.clientY; drag.moved+=Math.abs(dx)+Math.abs(dy);
  if(mode==='field'&&stateF==='search'){ yaw+=dx*.005; pitch=clamp(pitch+dy*.003,-.5,.5); }
  else if(mode==='ar'&&stateF==='search'&&!orient){ arYaw+=dx*.005; arPitch=clamp(arPitch+dy*.003,-.9,.6); }
  else if(mode==='globe'||mode==='title'){ globe.rotation.y+=dx*.006; globe.rotation.x=clamp(globe.rotation.x+dy*.006,-1.2,1.2); }
});
cv.addEventListener('pointerup',e=>{ const d=drag; drag=null; if(d&&(d.moved<10||stateF==='catch')) tap(e.clientX,e.clientY); });
cv.addEventListener('pointercancel',()=>{ drag=null; });

function tap(cx,cy){
  const ndc=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
  if(mode==='globe'){
    ray.setFromCamera(ndc,globeCam); const hit=ray.intersectObject(earth)[0];
    if(!hit){ return; }
    const lp=globe.worldToLocal(hit.point.clone()).normalize(); let best=null,bd=9;
    REGIONS.forEach(r=>{ const a=Math.acos(clamp(lp.dot(ll(r.lat,r.lon,1).normalize()),-1,1)); if(a<bd){ bd=a; best=r; } });
    if(best&&bd<.26) enterRegion(best); else { toast('ひかっている ところを タッチしてね'); tone(300,.12); }
  } else if(mode==='field'){
    if(stateF==='search'){
      ray.setFromCamera(ndc,fieldCam); const hits=ray.intersectObjects(bushes,true);
      if(hits.length){ let o=hits[0].object; while(o&&o.userData.idx===undefined) o=o.parent;
        if(o){ if(o.userData.idx===target) reveal(); else { o.userData.wig=performance.now()/1000; tone(220,.12,'sine',.1); $('msg2').textContent='ここには いないよ。ほかを さがしてね'; $('msg2').classList.remove('hidden'); } } }
    } else if(stateF==='catch') catchTap();
  } else if(mode==='ar'){
    if(stateF==='search'&&arPlaced){
      ray.setFromCamera(ndc,arCam); const hits=ray.intersectObjects(arBushes,true);
      if(hits.length){ let o=hits[0].object; while(o&&o.userData.idx===undefined) o=o.parent;
        if(o){ if(o.userData.target) arReveal(); else { o.userData.wig=performance.now()/1000; tone(220,.12,'sine',.1); $('msg2').textContent='ここには いないよ。ほかを さがしてね'; $('msg2').classList.remove('hidden'); } } }
    } else if(stateF==='catch') catchTap();
  }
}
const KM={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
addEventListener('keydown',e=>{ if(KM[e.key]){ keys[KM[e.key]]=true; e.preventDefault(); } });
addEventListener('keyup',e=>{ if(KM[e.key]){ keys[KM[e.key]]=false; } });
document.querySelectorAll('.arrow').forEach(b=>{
  const k=b.dataset.k, on=e=>{ e.preventDefault(); keys[k]=true; b.classList.add('on'); A(); }, off=()=>{ keys[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off));
});
$('startBtn').onclick=()=>{ A(); tone(523,.15,'triangle'); tone(784,.25,'triangle',.15,.12); say('ユーマスター、はじまるよ'); mode='globe'; goGlobe(); };
$('arBtn').onclick=()=>{
  A();
  if(!arOn&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){ DeviceOrientationEvent.requestPermission().catch(()=>{}); }
  setAR(!arOn); tone(arOn?880:440,.12,'triangle');
  toast(arOn?'📷 カメラで さがすよ！ ひかっている ところを タッチしてね':'🌳 けしきの なかで さがすよ');
  say(arOn?'カメラで さがすよ':'けしきの なかで さがすよ');
};
setAR(arOn);
if(UI_IMAGES.logo){ const im=new Image(); im.className='logo-img'; im.alt='ユーマスター'; im.onload=()=>{ $('logo').replaceWith(im); }; im.src=UI_IMAGES.logo; }
$('zukanBtn').onclick=openZukan;
$('zclose').onclick=()=>$('zukan').classList.add('hidden');
$('zreset').onclick=()=>{ if(!resetArm){ resetArm=true; $('zreset').textContent='もういちど おすと けします'; } else { caught=[]; store.set(caught); renderZukan(); updateCnt(); } };
$('backBtn').onclick=()=>{ if(stateF==='reveal'||stateF==='done') return; if(mode==='loading') mode='leaving'; fadeTo(goGlobe); };
$('sndBtn1').onclick=toggleSound; $('sndBtn2').onclick=toggleSound;

/* ============ ループ ============ */
function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  const asp=w/h; globeCam.aspect=asp; globeCam.position.set(0,0,asp<1?2.7/asp:3.2); globeCam.updateProjectionMatrix();
  fieldCam.aspect=asp; fieldCam.fov=asp<1?85:70; fieldCam.updateProjectionMatrix();
  arCam.aspect=asp; arCam.fov=asp<1?72:55; arCam.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

let last=performance.now(), rustleT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now; const t=now/1000;
  if(mode==='ar'&&arScene){ updateAR(dt,t); return; }
  if(mode==='loading'||mode==='leaving'||(mode==='ar'&&!arScene)){ renderer.clear(); return; }
  if(mode==='field'&&fieldScene){
    if(stateF==='search'){
      yaw+=((keys.left?1:0)-(keys.right?1:0))*1.7*dt; pitch=clamp(pitch+((keys.up?1:0)-(keys.down?1:0))*1.0*dt,-.5,.5);
      searchT+=dt;
      let d=((targetAngle-yaw)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;   // -π..π、正=左にいる
      rustleT-=dt; if(rustleT<=0){ rustleT=1.5; rustle(-Math.sin(d),.06+.16*(Math.cos(d)+1)/2); }
      const e=$('edge');
      if(searchT>HINT_SECONDS&&Math.abs(d)>.6){ e.classList.remove('hidden'); e.textContent=d>0?'◀':'▶'; e.className=d>0?'l':'r'; } else e.classList.add('hidden');
    }
    clouds.forEach(p=>{ p.rotation.y+=p.userData.sp*dt; });
    fieldCam.rotation.set(pitch,yaw,0,'YXZ');
    bushes.forEach((b,i)=>{
      const u=b.userData; let ox=0,rz=0;
      if(i===target&&(stateF==='search')){ ox=Math.sin(t*38)*.07; rz=Math.sin(t*31)*.06; }
      const w=t-u.wig; if(w<.6){ ox+=Math.sin(w*40)*.05*(1-w/.6); rz+=Math.sin(w*36)*.05*(1-w/.6); }
      b.position.x=u.base.x+ox; b.rotation.z=rz;
    });
    renderer.render(fieldScene,fieldCam);
  } else {
    if(mode==='title') globe.rotation.y+=.25*dt;
    else { globe.rotation.y+=((keys.right?1:0)-(keys.left?1:0))*1.4*dt; globe.rotation.x=clamp(globe.rotation.x+((keys.down?1:0)-(keys.up?1:0))*1.0*dt,-1.2,1.2); }
    REGIONS.forEach(r=>{ const done=caught.includes(umaOf(r).id), col=done?0x6bff9a:0xffd54a; r.m.material.color.setHex(col); r.m.rotation.y=t*2; r.h.material.color.setHex(col);
      const s=1+.45*Math.sin(t*3+r.lat); r.h.scale.setScalar(done?1:s); r.h.material.opacity=done?.2:.28+.18*Math.sin(t*3+r.lat); });
    renderer.render(globeScene,globeCam);
    if(mode==='globe') updateLabels();
  }
}
requestAnimationFrame(loop);
